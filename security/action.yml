name: 'Security Scan'
description: 'An action to perform a security audit to identify vulnerabilities, secrets, and dependency issues.'

inputs:
  python-version:
    description: 'The Python version to use'
    required: true

  sync-extras:
    description: 'Space-separated extras to sync'
    required: false
    default: ''

  sync-groups:
    description: 'Space-separated dependency groups to sync in addition to the defaults'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "latest"

    - name: Setup Python
      run: uv python install ${{ inputs.python-version }}
      shell: bash

    - name: Install project dependencies
      run: |
        ARGS=""

        for group in $SYNC_GROUPS; do
          ARGS="$ARGS --group $group"
        done

        for extra in $SYNC_EXTRAS; do
          ARGS="$ARGS --extra $extra"
        done

        uv sync $ARGS
      shell: bash
      env:
        SYNC_EXTRAS: ${{ inputs.sync-extras }}
        SYNC_GROUPS: ${{ inputs.sync-groups }}

    - name: Install security tools
      run: uv tool install pip-audit
      shell: bash

    - name: Run pip-audit
      run: |
        set -o pipefail
        uv tool run pip-audit | tee pip_audit_report.txt || echo "::warning::pip-audit found vulnerabilities"
      shell: bash

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

    - name: Run Trivy
      run: trivy fs . --severity LOW,MEDIUM,HIGH,CRITICAL --format table | tee trivy_report.txt
      shell: bash

    - name: Upload Security Reports
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          pip_audit_report.txt
          trivy_report.txt
        retention-days: 7
